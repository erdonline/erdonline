services:
  mysql:
    image: mysql:8.0
    container_name: erd-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # 镜像官方变量（下划线）；值与 Railway/App 侧 MYSQLDATABASE/MYSQLUSER/MYSQLPASSWORD 对齐
      MYSQL_DATABASE: ${MYSQLDATABASE:-erd}
      MYSQL_USER: ${MYSQLUSER:-erd}
      MYSQL_PASSWORD: ${MYSQLPASSWORD:-erd}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - erd-mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6.2
    container_name: erd-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - erd-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    # Prefer prebuilt GHCR image; `docker compose build backend` still builds from ./backend
    image: ghcr.io/erdonline/erdonline-backend:${ERD_IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: erd-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MYSQLHOST: mysql
      MYSQLPORT: 3306
      MYSQLDATABASE: ${MYSQLDATABASE:-erd}
      MYSQLUSER: ${MYSQLUSER:-erd}
      MYSQLPASSWORD: ${MYSQLPASSWORD:-erd}
      # compose 内官方 MySQL 镜像默认无 TLS；prod profile JDBC 默认开 SSL，须显式关掉以免打不开池
      MYSQL_USE_SSL: ${MYSQL_USE_SSL:-false}
      MYSQL_REQUIRE_SSL: ${MYSQL_REQUIRE_SSL:-false}
      MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL: ${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:-true}
      REDISHOST: redis
      REDISPORT: 6379
      # prod 要求 REDISPASSWORD 占位符存在；无密码 Redis 用空串（Normalizer→null）
      REDISPASSWORD: ${REDISPASSWORD:-}
      REDISUSER: ${REDISUSER:-}
      # prod 强制 JWT_SECRET；compose 本地默认串 ≠ 仓库 application.yml 开发默认（JwtConfig 会拒后者）
      JWT_SECRET: ${JWT_SECRET:-change-me-compose-jwt-secret-min-32-chars!!!!}
      # prod 强制 ERD_OIDC_HMAC；compose 默认串 ≠ 仓库 application.yml 开发默认
      ERD_OIDC_HMAC: ${ERD_OIDC_HMAC:-change-me-compose-oidc-hmac-min-32-chars!!!!}
      # prod 强制 UI Origin（CORS+SocketIO；禁 *）
      ERD_UI_URL: ${ERD_UI_URL:-http://localhost:8000}
    ports:
      - "${BACKEND_PORT:-9502}:9502"
      - "9092:9092"

  frontend:
    image: ghcr.io/erdonline/erdonline-frontend:${ERD_IMAGE_TAG:-latest}
    build:
      context: ./frontend
    container_name: erd-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # 留空 = 同源，由 nginx 反代 /oauth /auth /syst /ncnb 到 backend
      API_URL: ${API_URL:-}
      ERD_API_URL: ${ERD_API_URL:-}
    ports:
      - "${FRONTEND_PORT:-8000}:80"

  # 逆向方言验证（profile=reverse）：PostgreSQL + SQL Server
  # 用法：docker-compose --profile reverse up -d postgres sqlserver
  postgres:
    profiles: ["reverse"]
    image: postgres:16
    container_name: erd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reverse
      POSTGRES_PASSWORD: reverse
      POSTGRES_DB: reverse_demo
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - erd-postgres-data:/var/lib/postgresql/data
      - ./db/reverse-fixtures/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reverse -d reverse_demo"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Azure SQL Edge：Apple Silicon / Colima arm64 可用；能力接近 SQL Server（验证 Dialect）
  sqlserver:
    profiles: ["reverse"]
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: erd-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Reverse_Passw0rd"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - erd-sqlserver-data:/var/opt/mssql
      - ./db/reverse-fixtures/sqlserver:/fixtures:ro
    # Edge 镜像未必带 sqlcmd；用 bash TCP 探活，种子由 scripts/dev-reverse-dbs.sh 灌入
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  erd-mysql-data:
  erd-redis-data:
  erd-postgres-data:
  erd-sqlserver-data:
