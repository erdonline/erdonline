<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <title>ERD Online Docs</title>
  <link rel="canonical" href="https://doc.erdonline.com/">
  <meta http-equiv="refresh" content="0;url=https://doc.erdonline.com/">
  <script>
    (function () {
      var prefix = '/erdonline';
      var path = location.pathname;
      if (path.indexOf(prefix) === 0) path = path.slice(prefix.length) || '/';
      if (path.charAt(0) !== '/') path = '/' + path;
      location.replace('https://doc.erdonline.com' + path + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>Documentation moved to <a href="https://doc.erdonline.com/">https://doc.erdonline.com/</a>.</p>
</body>
</html>
