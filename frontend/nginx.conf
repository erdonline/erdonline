# ADR-0025：社交爬虫（unfurl bot）按 User-Agent 分流到后端 OG 揭示页；真人保持 SPA。
map $http_user_agent $og_is_bot {
    default 0;
    "~*(facebookexternalhit|Twitterbot|Slackbot|LinkedInBot|WhatsApp|TelegramBot|Discordbot|Pinterest|redditbot|Googlebot|Google-InspectionTool|bingbot|Applebot|Embedly|Qwantify|SkypeUriPreview|vkShare|Mastodon|Prerender|WeChat|MicroMessenger|Bytespider|Baiduspider|Sogou|360Spider)" 1;
}

# Known client-side routes → index.html (200). Unknown paths → HTTP 404 + 404.html SPA shell.
# Keep in sync with frontend/scripts/seo-config.mjs (CF Pages _redirects).
map $uri $spa_fallback {
    default 0;
    ~^/$ 1;
    ~^/compare$ 1;
    ~^/demo$ 1;
    ~^/en$ 1;
    ~^/en/compare$ 1;
    ~^/en/demo$ 1;
    ~^/en/catalog$ 1;
    ~^/catalog(/|$) 1;
    ~^/s/[^/]+$ 1;
    ~^/login(/|$) 1;
    ~^/register(/|$) 1;
    ~^/oauth/authorize$ 1;
    ~^/403$ 1;
    ~^/project(/|$) 1;
    ~^/design(/|$) 1;
    ~^/dataModels(/|$) 1;
    ~^/home(/|$) 1;
    ~^/databaseConfig(/|$) 1;
    ~^/account(/|$) 1;
}

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    client_max_body_size 20m;
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript text/css application/xml application/json image/svg+xml;

    # env-config.js 不缓存，保证运行时注入的后端地址即时生效
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    # ADR-0025：OG 揭示页与动态卡片图（/og/**）恒走后端（og:image 抓取为任意 UA）
    location ^~ /og/ {
        proxy_pass         http://backend:9502;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ADR-0025：只读分享 /s/:token —— 爬虫走后端 OG 揭示页，真人走 SPA
    location ~ ^/s/[^/]+$ {
        if ($og_is_bot) {
            rewrite ^ /_og last;
        }
        try_files $uri /index.html;
    }

    # ADR-0025：公开演示 /demo —— 爬虫取品牌 OG 卡片，真人走 SPA
    location = /demo {
        if ($og_is_bot) {
            rewrite ^ /_og last;
        }
        try_files $uri /index.html;
    }

    # 内部：把原始 URI（/s/{token} 或 /demo）拼成后端 /og 路径反代（proxy_pass 带 URI 只能在非 if 的 location）
    location = /_og {
        internal;
        proxy_pass         http://backend:9502/og$request_uri;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA 404 shell (copy of index.html; emitted by scripts/gen-seo-static.mjs at build time)
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # SPA 前端路由：已知 pathname → index.html；未知 → 404（真状态码，仍渲染 SPA 404 页）
    location / {
        try_files $uri $uri/ @maybe_spa;
    }

    location @maybe_spa {
        if ($spa_fallback) {
            rewrite ^ /index.html last;
        }
        return 404;
    }

    # 后端 API 反向代理（同源部署时生效；容器内通过服务名 backend 访问）
    location ~ ^/(oauth|auth|syst|ncnb)/ {
        proxy_pass         http://backend:9502;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180;
        # WebSocket（ncnb 实时协作 socket.io）
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # OIDC discovery / JWKS（issuer 默认同源 ERD_UI_URL）
    location ^~ /.well-known/ {
        proxy_pass         http://backend:9502;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
