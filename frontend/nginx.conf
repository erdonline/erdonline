server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    client_max_body_size 20m;
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript text/css application/xml application/json image/svg+xml;

    # env-config.js 不缓存，保证运行时注入的后端地址即时生效
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    # SPA 前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（同源部署时生效；容器内通过服务名 backend 访问）
    location ~ ^/(oauth|auth|syst|ncnb)/ {
        proxy_pass         http://backend:9502;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180;
        # WebSocket（ncnb 实时协作 socket.io）
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
