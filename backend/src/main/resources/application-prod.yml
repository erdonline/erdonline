# 生产环境：全部通过环境变量注入（见根目录 .env.example / docker-compose.yml）

# 禁止 e2e* / admin+种子默认口令登录 / 开放注册（即使库里有记录；改密后的 admin 仍可登）
# JWT：强制环境注入，无仓库默认值；缺 JWT_SECRET 时占位符解析失败（fail-fast）。
# 另见 JwtConfig：prod 拒绝 blank 与 application.yml 已知开发默认串。
erd:
  security:
    e2e-accounts-enabled: false
    allow-demo-admin: false
    allow-open-register: false
  jwt:
    secret: ${JWT_SECRET}

spring:
  # 凭证强制环境注入：application.yml 的弱默认值仅供开发，prod 下重新声明为无默认值，
  # 缺环境变量时启动直接失败（fail-fast），杜绝默认密码随生产部署上线。
  # JDBC TLS（R-CFG-03）：双 DS 同串；prod 默认 useSSL+requireSSL，allowPublicKeyRetrieval 关。
  # 本地 compose MySQL 无 TLS → 须显式 MYSQL_USE_SSL=false（见 docker-compose.yml）。
  datasource:
    martin:
      username: ${MYSQLUSER}
      password: ${MYSQLPASSWORD}
      jdbc-url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:erd}?useUnicode=true&useSSL=${MYSQL_USE_SSL:true}&requireSSL=${MYSQL_REQUIRE_SSL:true}&characterEncoding=utf8&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
    erd:
      username: ${MYSQLUSER}
      password: ${MYSQLPASSWORD}
      jdbc-url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:erd}?useUnicode=true&useSSL=${MYSQL_USE_SSL:true}&requireSSL=${MYSQL_REQUIRE_SSL:true}&characterEncoding=utf8&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
  data:
    redis:
      # Railway 注入 REDISPASSWORD；compose 无密码时设 REDISPASSWORD=（空串→Normalizer 置 null）
      password: ${REDISPASSWORD}
  thymeleaf:
    prefix: classpath:/views/
    suffix: .html
    cache: true

# Origin：prod 禁止 *。单一规范名 ERD_UI_URL → SocketIO + CORS（CrossOriginPolicy 读 martin.ui.url）。
# 缺 ERD_UI_URL → 占位符失败（fail-fast）。勿再设 SOCKETIO_ORIGIN / CORS_ALLOWED_ORIGINS。
# OSS：默认不强制 OSS_*（MinIO 可选）。启用时设 OSS_ENDPOINT + 非默认密钥；OssCredentialGuard 拒 minio/minio123。
martin:
  socketio:
    origin: ${ERD_UI_URL}
  ui:
    url: ${ERD_UI_URL}

# springdoc：本地/dev 默认开；prod 关 UI 与 /v3/api-docs（唯一门控，无 martin.swagger 键）。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.erdonline: info
    root: warn
