# 生产环境：全部通过环境变量注入（见根目录 .env.example / docker-compose.yml）

# 禁止 e2e* / admin+种子默认口令登录（即使库里有记录；改密后的 admin 仍可登）
# JWT：强制环境注入，无仓库默认值；缺 JWT_SECRET 时占位符解析失败（fail-fast）。
# 另见 JwtConfig：prod 拒绝 blank 与 application.yml 已知开发默认串。
erd:
  security:
    e2e-accounts-enabled: false
    allow-demo-admin: false
  jwt:
    secret: ${JWT_SECRET}

spring:
  # 凭证强制环境注入：application.yml 的弱默认值仅供开发，prod 下重新声明为无默认值，
  # 缺环境变量时启动直接失败（fail-fast），杜绝默认密码随生产部署上线。
  datasource:
    martin:
      username: ${MYSQLUSER}
      password: ${MYSQLPASSWORD}
    erd:
      username: ${MYSQLUSER}
      password: ${MYSQLPASSWORD}
  data:
    redis:
      # Railway 注入 REDISPASSWORD；compose 无密码时设 REDISPASSWORD=（空串→Normalizer 置 null）
      password: ${REDISPASSWORD}
  thymeleaf:
    prefix: classpath:/views/
    suffix: .html
    cache: true

# Origin：prod 禁止 *。SOCKETIO_ORIGIN 优先，否则 ERD_UI_URL；二者皆缺 → 占位符失败（fail-fast）。
# HTTP CORS 另见 CrossOriginPolicy（CORS_ALLOWED_ORIGINS 或回落 martin.ui.url）。
martin:
  oss:
    accessKey: ${OSS_ACCESS_KEY}
    secretKey: ${OSS_SECRET_KEY}
  socketio:
    origin: ${SOCKETIO_ORIGIN:${ERD_UI_URL}}
  ui:
    url: ${ERD_UI_URL:${SOCKETIO_ORIGIN}}

# springdoc 默认开启（本地/dev 可用 /swagger-ui）；prod 关闭 UI 与 /v3/api-docs。
# 注：application.yml 的 martin.swagger.enabled 不门控 springdoc，勿依赖该死键。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.erdonline: info
    root: warn
