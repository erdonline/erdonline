server:
  port: 9502
  servlet:
    context-path: /
  # Boot 3：请求头上限（非 server.tomcat.*）。JWT 含 authorities 时常 >8KB，默认拒成 HTML 400
  max-http-request-header-size: 64KB
  tomcat:
    uri-encoding: UTF-8
    max-http-response-header-size: 64KB

spring:
  application:
    name: erd-online
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 单库：禁用 Boot 默认 Flyway；由 ErdFlywayConfig 打到业务库（ADR-0020）
  flyway:
    enabled: false
  # Boot 2.7 默认禁止循环依赖；OAuth2 Autoconfig 过渡期先放开，后续拆 TokenStore 解环
  main:
    allow-circular-references: true
  # Boot 2.7 默认 PathPatternParser 与 springfox 2.9 不兼容，退回 AntPathMatcher
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # 单一业务库（ADR-0020）。两套 Hikari/SqlSessionFactory 同库；占位符均为 Railway 插件原生名单变量，无嵌套回退。
  # MySQL：MYSQLHOST / MYSQLPORT / MYSQLDATABASE / MYSQLUSER / MYSQLPASSWORD（勿用 MYSQL_URL / SPRING_DATASOURCE_URL）。
  # JDBC TLS：MYSQL_USE_SSL / MYSQL_REQUIRE_SSL / MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL（本地默认关 SSL；prod 见 application-prod.yml）。
  # Redis：REDISHOST / REDISPORT / REDISUSER / REDISPASSWORD（勿用 REDIS_URL；空密码由 RedisBlankCredentialNormalizer 置 null）。
  # 见 docs/deployment.md。
  datasource:
    martin:
      jdbc-url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:erd}?useUnicode=true&useSSL=${MYSQL_USE_SSL:false}&characterEncoding=utf8&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
      username: ${MYSQLUSER:erd}
      password: ${MYSQLPASSWORD:erd}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 20
      auto-commit: true
      pool-name: MartinHikariCP
      max-lifetime: 1800000
      connection-timeout: 60000
      connection-test-query: SELECT 1
    erd:
      jdbc-url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:erd}?useUnicode=true&useSSL=${MYSQL_USE_SSL:false}&characterEncoding=utf8&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
      username: ${MYSQLUSER:erd}
      password: ${MYSQLPASSWORD:erd}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 20
      auto-commit: true
      pool-name: ErdHikariCP
      max-lifetime: 1800000
      connection-timeout: 60000
      connection-test-query: SELECT 1
  # Boot 3 / Redisson 只认 spring.data.redis.*（spring.redis.* 已 error 级废弃）
  data:
    redis:
      host: ${REDISHOST:localhost}
      port: ${REDISPORT:6379}
      database: ${REDIS_DB:0}
      username: ${REDISUSER:}
      password: ${REDISPASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# ERD Online 业务开关（原 Martin 配置，去除 feign/message/sentinel）
# springdoc：用 springdoc.*.enabled（prod 关）；勿再加 martin.swagger（死键）
# oauth2 resource server 常驻，无 martin.resource-server 开关
martin:
  data:
    enabled: true
  # MinIO 可选：未设 OSS_ENDPOINT 则不建客户端（内置 Word 模板仍可用）。
  # 凭证经嵌套 martin.oss.minio.* 绑定；仓库不写弱默认（R-CFG-05）；prod 见 OssCredentialGuard。
  oss:
    enabled: true
    minio:
      endpoint: ${OSS_ENDPOINT:}
      accessKey: ${OSS_ACCESS_KEY:}
      secretKey: ${OSS_SECRET_KEY:}
  websocket:
    enabled: false
  socketio:
    enabled: true
    hostname: ${SOCKETIO_HOST:0.0.0.0}
    port: ${SOCKETIO_PORT:9092}
    # 本地/dev 默认 *；prod 覆盖为 ${ERD_UI_URL}（见 application-prod.yml + CrossOriginPolicy）
    origin: ${SOCKETIO_ORIGIN:*}
    bossThreads: 0
    workerThreads: 0
    upgradeTimeout: 10000
    pingTimeout: 60000
    pingInterval: 25000
    firstDataTimeout: 5000
    maxHttpContentLength: 65536
    maxFramePayloadLength: 65536
  # CORS 源（CrossOriginPolicy）；prod 无默认，须 ERD_UI_URL
  ui:
    url: ${ERD_UI_URL:http://localhost:8000}

# OpenAI / ChatGPT-SQL 功能（可选，设置 token 后启用）
openai:
  token: ${OPENAI_TOKEN:}
  secret: ${OPENAI_SECRET:}
  apiHost: ${OPENAI_API_HOST:https://api.openai.com/}
  proxy:
    host: ${OPENAI_PROXY_HOST:}
    port: ${OPENAI_PROXY_PORT:0}
    timeout: ${OPENAI_PROXY_TIMEOUT:60}
  limit:
    exclude: ${OPENAI_LIMIT_EXCLUDE:}
    times: ${OPENAI_LIMIT_TIMES:10}

mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.erdonline: info

# 自部署可观测（少量、低成本）：仅 health + info；勿暴露 env/beans/heapdump
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # actuator 已在 ignore-urls 匿名可达：只给 UP/DOWN，不泄露数据源细节
      show-details: never
      # PaaS（Railway）部署门禁用 liveness（进程已听端口即可）；
      # 聚合 /actuator/health 仍含 db/redis，依赖未就绪时会 503
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false

# JWT + 安全开关（本地/dev 弱默认仅供 DX；prod 见 application-prod.yml 无默认 + JwtConfig 拒仓库串）
erd:
  jwt:
    secret: ${JWT_SECRET:erd-online-dev-jwt-secret-change-me-32bytes!!}
    expires-in: ${JWT_EXPIRES_IN:43200}
    issuer: erd-online
  # data_sources.username/password 落库加密密钥（R-DATA-06，AES-256-GCM）；
  # 本地/dev 弱默认仅供 DX；prod 见 application-prod.yml 无默认 + DataSourceCredentialCipher 拒仓库串
  datasource-secret:
    key: ${ERD_DB_CONFIG_SECRET:erd-online-dev-datasource-secret-change-me-32bytes!!}
  security:
    e2e-accounts-enabled: ${ERD_E2E_ACCOUNTS_ENABLED:false}
    # 种子 admin/123456：dev profile 覆盖为 true；prod 强制 false
    allow-demo-admin: ${ERD_ALLOW_DEMO_ADMIN:false}
    # 开放注册：dev=true；prod/默认=false（自托管公网建议关闭）
    allow-open-register: ${ERD_ALLOW_OPEN_REGISTER:false}
  # ADR-0013 公开 API：Redisson 集群限流（fail-closed）；见 PublicApiRateLimiter
  public-api:
    rate-limit-per-minute: ${ERD_PUBLIC_API_RATE_LIMIT:60}
    # OAuth access_token TTL（秒）；authorization_code 短码 TTL 另见下
    oauth-access-token-ttl-seconds: ${ERD_PUBLIC_API_OAUTH_TTL:3600}
    # Authorization Code 明文有效期（秒），默认 120；单次使用 + SHA-256 入库
    oauth-auth-code-ttl-seconds: ${ERD_PUBLIC_API_OAUTH_CODE_TTL:120}
    # refresh_token TTL（秒），默认 30 天；仅 authorization_code 换票签发；轮换复用检测
    oauth-refresh-token-ttl-seconds: ${ERD_PUBLIC_API_OAUTH_REFRESH_TTL:2592000}
  # OIDC：RS256 id_token + JWKS；issuer 默认回落 martin.ui.url（ERD_UI_URL）
  # 密钥：ERD_OIDC_RSA_PRIVATE_KEY（PEM）或 ERD_OIDC_RSA_PRIVATE_KEY_PATH；prod 必填
  # 非 prod 未配置时自动生成 ~/.erdonline/oidc-rsa-private.pem（仓外）
  oidc:
    issuer: ${ERD_OIDC_ISSUER:}
    rsa-private-key: ${ERD_OIDC_RSA_PRIVATE_KEY:}
    rsa-private-key-path: ${ERD_OIDC_RSA_PRIVATE_KEY_PATH:}
    rsa-keystore-path: ${ERD_OIDC_RSA_KEYSTORE_PATH:}
    rsa-keystore-password: ${ERD_OIDC_RSA_KEYSTORE_PASSWORD:}
    rsa-key-alias: ${ERD_OIDC_RSA_KEY_ALIAS:}
    rsa-key-id: ${ERD_OIDC_RSA_KID:}
    id-token-ttl-seconds: ${ERD_OIDC_ID_TOKEN_TTL:3600}
  # ADR-0021 第三方 IdP 联邦：缺 CLIENT_/APP_ 凭证则该 provider 关闭，不阻断启动
  federate:
    success-path: ${ERD_FEDERATE_SUCCESS_PATH:/login/federate}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_REDIRECT_URI:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
    wechat:
      app-id: ${WECHAT_APP_ID:}
      app-secret: ${WECHAT_APP_SECRET:}
      redirect-uri: ${WECHAT_REDIRECT_URI:}

# 安全放行 URL
security:
  oauth2:
    client:
      ignore-urls:
        - /login
        - /auth/login
        - /actuator/**
        - /exit
        # 产品注册页 POST /ncnb/project/group/user/register（前缀剥离后）；勿再放行 /user/register
        - /project/group/user/register
        # ADR-0013 OAuth：token / revoke / userinfo（匿名 Spring；userinfo 内验 OAT+openid）
        - /oauth/token
        - /auth/oauth/token
        - /oauth/revoke
        - /auth/oauth/revoke
        - /oauth/userinfo
        - /auth/oauth/userinfo
        # OIDC discovery / JWKS（公钥；私钥永不发布）
        - /.well-known/openid-configuration
        - /.well-known/jwks.json
        # ADR-0021 联邦：匿名起跳/回调/providers/短票换票；links 管理须会话 JWT
        - /federate/providers
        - /auth/federate/providers
        - /federate/session
        - /auth/federate/session
        - /federate/github
        - /auth/federate/github
        - /federate/github/callback
        - /auth/federate/github/callback
        - /federate/google
        - /auth/federate/google
        - /federate/google/callback
        - /auth/federate/google/callback
        - /federate/wechat
        - /auth/federate/wechat
        - /federate/wechat/callback
        - /auth/federate/wechat/callback
        - /error
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-ui.html
        - /webjars/**
        # 只读分享：匿名仅 GET token（create/revoke/fork 需登录；见 ErdSecurityConfiguration）
        # 不再用 /share/** 全方法放行，避免匿名 POST revoke
        # R-DEAD-03：勿加 /endpoint/**（无控制器；匿名误挂面）
