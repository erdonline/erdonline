server:
  port: 9502
  servlet:
    context-path: /
  # Boot 3：请求头上限（非 server.tomcat.*）。JWT 含 authorities 时常 >8KB，默认拒成 HTML 400
  max-http-request-header-size: 64KB
  tomcat:
    uri-encoding: UTF-8
    max-http-response-header-size: 64KB

spring:
  application:
    name: erd-online
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 单库：禁用 Boot 默认 Flyway；由 ErdFlywayConfig 打到业务库（ADR-0020）
  flyway:
    enabled: false
  # Boot 2.7 默认禁止循环依赖；OAuth2 Autoconfig 过渡期先放开，后续拆 TokenStore 解环
  main:
    allow-circular-references: true
  # Boot 2.7 默认 PathPatternParser 与 springfox 2.9 不兼容，退回 AntPathMatcher
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # 单一业务库 `erd`（ADR-0020）。仍保留两套 Hikari/SqlSessionFactory（按 mapper 包路由），
  # 但 JDBC 指向同一 DB_NAME。唯一环境变量族：DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD。
  # Railway：App 侧 Variable Reference 插件 MYSQL* → 上述 DB_*（见 docs/deployment.md）。
  # 勿把插件 MYSQLDATABASE（常为 railway）当业务库；勿依赖 SPRING_DATASOURCE_URL / MYSQL_URL。
  datasource:
    martin:
      jdbc-url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:erd}?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      username: ${DB_USERNAME:erd}
      password: ${DB_PASSWORD:erd}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 20
      auto-commit: true
      pool-name: MartinHikariCP
      max-lifetime: 1800000
      connection-timeout: 60000
      connection-test-query: SELECT 1
    erd:
      jdbc-url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:erd}?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      username: ${DB_USERNAME:erd}
      password: ${DB_PASSWORD:erd}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 20
      auto-commit: true
      pool-name: ErdHikariCP
      max-lifetime: 1800000
      connection-timeout: 60000
      connection-test-query: SELECT 1
  # Boot 3 / Redisson 只认 spring.data.redis.*（spring.redis.* 已 error 级废弃）
  # 本地/compose：host/port（无密码）。Railway：设环境变量 SPRING_DATA_REDIS_URL（Boot 松散绑定 → url，覆盖 host/port/user/password）
  # 勿在 yml 写 url/password 的 ${VAR:} 空默认（空串 ≠ unset → WRONGPASS / 坏本地无密码 Redis）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# ERD Online 业务开关（原 Martin 配置，去除 feign/message/sentinel）
martin:
  swagger:
    enabled: true
  resource-server:
    enabled: true
  data:
    enabled: true
  social:
    enabled: ${MARTIN_SOCIAL_ENABLED:false}
  oss:
    enabled: true
    type: ${OSS_TYPE:0}
    endpoint: ${OSS_ENDPOINT:http://localhost:9000/}
    accessKey: ${OSS_ACCESS_KEY:minio}
    secretKey: ${OSS_SECRET_KEY:minio123}
  websocket:
    enabled: false
  socketio:
    enabled: true
    hostname: ${SOCKETIO_HOST:0.0.0.0}
    port: ${SOCKETIO_PORT:9092}
    origin: ${SOCKETIO_ORIGIN:*}
    bossThreads: 0
    workerThreads: 0
    upgradeTimeout: 10000
    pingTimeout: 60000
    pingInterval: 25000
    firstDataTimeout: 5000
    maxHttpContentLength: 65536
    maxFramePayloadLength: 65536
  ui:
    url: ${ERD_UI_URL:http://localhost:8000}

# OpenAI / ChatGPT-SQL 功能（可选，设置 token 后启用）
openai:
  token: ${OPENAI_TOKEN:}
  secret: ${OPENAI_SECRET:}
  apiHost: ${OPENAI_API_HOST:https://api.openai.com/}
  proxy:
    host: ${OPENAI_PROXY_HOST:}
    port: ${OPENAI_PROXY_PORT:0}
    timeout: ${OPENAI_PROXY_TIMEOUT:60}
  limit:
    exclude: ${OPENAI_LIMIT_EXCLUDE:}
    times: ${OPENAI_LIMIT_TIMES:10}

mybatis-plus:
  global-config:
    banner: false
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.erdonline: info

# 自部署可观测（少量、低成本）：仅 health + info；勿暴露 env/beans/heapdump
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # actuator 已在 ignore-urls 匿名可达：只给 UP/DOWN，不泄露数据源细节
      show-details: never
      # PaaS（Railway）部署门禁用 liveness（进程已听端口即可）；
      # 聚合 /actuator/health 仍含 db/redis，依赖未就绪时会 503
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false

# JWT + 安全开关（生产务必覆盖密钥；e2e 账号默认禁止登录）
erd:
  jwt:
    secret: ${JWT_SECRET:erd-online-dev-jwt-secret-change-me-32bytes!!}
    expires-in: ${JWT_EXPIRES_IN:43200}
    issuer: erd-online
  security:
    e2e-accounts-enabled: ${ERD_E2E_ACCOUNTS_ENABLED:false}

# 安全放行 URL
security:
  oauth2:
    client:
      ignore-urls:
        - /login
        - /auth/login
        - /actuator/**
        - /exit
        - /register
        - /user/register
        # 产品注册页 POST /ncnb/project/group/user/register（前缀剥离后）
        - /project/group/user/register
        - /user/loadUserByUsername/*
        - /endpoint/**
        - /error
        - /v3/api-docs/**
        - /swagger-ui/**
        - /swagger-ui.html
        - /webjars/**
        # 只读分享：匿名仅 GET token（create/revoke/fork 需登录；见 ErdSecurityConfiguration）
        # 不再用 /share/** 全方法放行，避免匿名 POST revoke
