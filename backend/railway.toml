# Railway official demo backend (ADR-0019).
# Dashboard MUST set:
#   Root Directory     = .  (repo root — Dockerfile COPY mcp/ + backend/)
#   Config as Code     = backend/railway.toml
# Build context is repo root; dockerfilePath points at backend/Dockerfile.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["/backend/**", "/mcp/**"]

[deploy]
# Liveness only（Boot probes）：进程已监听即绿。勿用聚合 /actuator/health——
# db/redis DOWN 会 503，PaaS 误判为部署失败。业务就绪仍看 /actuator/health。
healthcheckPath = "/actuator/health/liveness"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
