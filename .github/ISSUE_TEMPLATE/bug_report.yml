name: Bug 报告 / Bug Report
description: 报告一个缺陷 / Report a bug
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 清晰描述这个 Bug / A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to Reproduce
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现错误 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected Behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围 / Area
      options:
        - 前端 Frontend
        - 后端 Backend
        - 部署 Deployment
        - 其他 Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息 / Environment
      placeholder: |
        - OS:
        - Browser:
        - Java / Node version:
        - Deployment: Docker / Local
    validations:
      required: false
