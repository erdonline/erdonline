name: 路线图投票 / Roadmap vote
description: 为公开路线图的一项优先级投票或补充场景（维护者汇总到 docs/roadmap.md）
title: "[roadmap] "
labels: ["roadmap"]
body:
  - type: markdown
    attributes:
      value: |
        ERD Online 是**数据库设计的 Git + Figma**。你的 👍 与具体场景会进入 [公开路线图](https://erdonline.github.io/erdonline/docs/roadmap) 的优先级讨论。
        若你只想认领小任务，请改用 **Good first issue** 模板。
  - type: dropdown
    id: topic
    attributes:
      label: 投票主题
      description: 从当前 backlog 选一项；选「其它」请在下方写清
      options:
        - 分享页转化（/s/:token 复制到我的项目 / 登录试用更显眼）
        - OG 社交预览图（og:image / GitHub social-preview 1280×640）
        - 30 秒激活链路（demo → 首次存版本再减步）
        - i18n 英文优先（语言切换 + 关键旅程 EN）
        - 逆向工程保真（复合 FK、Trigger 等）
        - 公开 API / MCP 写能力扩展
        - 其它（正文说明）
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么重要 / 你的场景
      description: 1–3 句即可；可贴链接（分享页、竞品、团队规模）
      placeholder: |
        我们每周把 ER 图发客户评审，外链打开后找不到「复制到我的项目」…
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: 怎样算做成了（验收想象）
      placeholder: |
        - [ ] 匿名访客 3 秒内看见主 CTA
        - [ ] fork 失败有明确 toast，不静默
    validations:
      required: true
  - type: checkboxes
    id: vote
    attributes:
      label: 投票
      options:
        - label: 我 👍 支持提高此项优先级（维护者会统计 reaction + 本字段）
          required: false
