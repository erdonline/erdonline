name: Frontend demo site

# Static SPA → Cloudflare Pages (project: erdonline-demo).
# Requires repo Variable DEMO_API_URL (Railway public API root); empty URL fails the build.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-demo-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: frontend-demo-pages
  cancel-in-progress: true

jobs:
  deploy-cloudflare:
    # Gate: Variable CLOUDFLARE_PAGES_DEPLOY=true (+ CF secrets). See docs/deployment.md.
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && vars.CLOUDFLARE_PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Install Playwright (prod smoke)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Umi route flatten (LocaleRoute gate)
        working-directory: frontend
        run: yarn check:routes

      # Runtime injection: env.sh → public/env-config.js → bundled into dist/.
      - name: Verify demo API URL
        env:
          DEMO_API_URL: ${{ vars.DEMO_API_URL }}
        run: |
          if [ -z "$DEMO_API_URL" ]; then
            echo "::error::DEMO_API_URL repository variable is empty. Set it in Settings → Secrets and variables → Actions → Variables (e.g. https://api.erdonline.com)."
            exit 1
          fi
          host=$(printf '%s' "$DEMO_API_URL" | sed -E 's|^https?://([^/@?#]+).*|\1|')
          echo "Demo API host=${host}"

      - name: Build production static site
        working-directory: frontend
        env:
          API_URL: ${{ vars.DEMO_API_URL }}
          ERD_API_URL: ${{ vars.DEMO_API_URL }}
          ERD_REQUIRE_REMOTE_API: "1"
          ERD_SITE_URL: ${{ vars.SEO_BASE_URL || 'https://www.erdonline.com' }}
        run: yarn build:prod

      - name: Production boot smoke (built dist, blocks deploy)
        working-directory: frontend
        env:
          PROD_SMOKE_SKIP_BUILD: '1'
        run: yarn check:prod-smoke

      - name: Verify SEO build artifacts
        working-directory: frontend
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/_redirects
          test -f dist/404.html
          grep -q '<urlset' dist/sitemap.xml
          grep -q '</urlset>' dist/sitemap.xml
          grep -q 'Sitemap: https://www.erdonline.com/sitemap.xml' dist/robots.txt
          ! grep -q '/\* /index.html 200' dist/_redirects
          ! grep -q '/\* / 200' dist/_redirects
          node ./scripts/assert-seo-static.mjs

      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create erdonline-demo --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=erdonline-demo --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
