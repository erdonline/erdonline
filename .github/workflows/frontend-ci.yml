name: Frontend CI

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: ESLint errors only
        working-directory: frontend
        run: yarn lint:js:ci

      - name: Build
        working-directory: frontend
        run: yarn build

      - name: Verify SEO build artifacts
        working-directory: frontend
        run: |
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/_redirects
          test -f dist/404.html
          grep -q '<urlset' dist/sitemap.xml
          grep -q 'Sitemap: https://www.erdonline.com/sitemap.xml' dist/robots.txt
          ! grep -q '/\* /index.html 200' dist/_redirects
