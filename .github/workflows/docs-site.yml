name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: website/yarn.lock

      - name: Install and build (doc.erdonline.com)
        working-directory: website
        env:
          DOCUSAURUS_URL: https://doc.erdonline.com
          DOCUSAURUS_BASE_URL: /
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Upload Cloudflare artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: website/build

  # Overwrite the old github.io Docusaurus copy so it cannot stay a second docs host.
  pack-github-pages-retire:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/gh-pages-retire

  deploy-github-pages-retire:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pack-github-pages-retire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages redirect stub
        id: deployment
        uses: actions/deploy-pages@v5

  # Sole docs host. Gate: repo Variable CLOUDFLARE_PAGES_DEPLOY=true
  # + secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — see docs/deployment.md.
  deploy-cloudflare:
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.CLOUDFLARE_PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - name: Download docs-site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: website/build

      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create erdonline-docs --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/build --project-name=erdonline-docs --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
