name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: website/yarn.lock

      - name: Install and build (GitHub Pages baseUrl)
        working-directory: website
        env:
          DOCUSAURUS_URL: https://erdonline.github.io
          DOCUSAURUS_BASE_URL: /erdonline/
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy-github-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Primary docs host (free tier). Gate: repo Variable CLOUDFLARE_PAGES_DEPLOY=true
  # + secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — see docs/deployment.md.
  # Without the Variable, only GitHub Pages above runs.
  deploy-cloudflare:
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.CLOUDFLARE_PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: website/yarn.lock

      - name: Install and build (Cloudflare Pages root baseUrl)
        working-directory: website
        env:
          DOCUSAURUS_URL: https://erdonline-docs.pages.dev
          DOCUSAURUS_BASE_URL: /
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/build --project-name=erdonline-docs
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
