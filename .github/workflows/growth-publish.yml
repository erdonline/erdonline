name: Growth publish package

# 文章发布包构建：PR 打 `growth-publish` 标签后，对 ready 文章生成各平台可粘贴的发布包。
# 发布动作本身仍是人工（掘金/知乎/V2EX/公众号无官方发布 API，见 docs/growth.md）。

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    paths:
      - 'content/articles/**'
      - 'scripts/growth/**'
      - '.github/workflows/growth-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    if: >
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'growth-publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build publish packages (ready articles)
        run: node scripts/growth/build-package.mjs --all

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: growth-publish-packages
          path: content/dist/
          retention-days: 30
