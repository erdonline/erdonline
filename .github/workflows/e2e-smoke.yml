name: e2e-smoke

# 核心旅程冒烟：登录 → 新建项目 → 进入设计器 → 删除确认。
# 全栈起服务（mysql + redis + backend:9502 + frontend:8000）后跑 Playwright 冒烟用例。
# 红线：此 workflow 失败 = 核心旅程断裂，禁止合并。
#
# 范围：只跑核心旅程冒烟（tests/e2e/smoke.spec.ts）——快且稳，作为每 PR 的合并门。
# 全量 143 条 e2e 回归不在此 gate 内跑：单 job 2 worker 跑全量需 ~45 分钟，远超 30 分钟
# timeout（长期被 cancel，等于无信号）。全量回归本地执行：`cd frontend && yarn test:e2e`
# （见 docs/development.md「E2E（Playwright）」）；后续如需 CI 全量应单开分片矩阵 workflow。

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        # options 只允许 docker create 旗标；MySQL 8 默认 utf8mb4，勿传 --character-set-server（会变 create 未知旗标 → exit 125）
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Init databases（建库/建表/种子/账号，顺序执行）
        run: |
          set -e
          for f in db/init/*.sql; do
            echo ">>> $f"
            mysql -h127.0.0.1 -uroot < "$f"
          done
          # GHA MySQL service 无 compose 的 erd 用户；对齐 application.yml 默认 erd/erd
          mysql -h127.0.0.1 -uroot <<'SQL'
          CREATE USER IF NOT EXISTS 'erd'@'%' IDENTIFIED BY 'erd';
          GRANT ALL PRIVILEGES ON `erd`.* TO 'erd'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Start backend（等待 actuator 就绪）
        working-directory: backend
        env:
          MYSQLHOST: 127.0.0.1
          MYSQLUSER: erd
          MYSQLPASSWORD: erd
          SPRING_PROFILES_ACTIVE: dev
        run: |
          nohup mvn -B spring-boot:run > backend.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9502/actuator/health || true)
            if [ "$code" = "200" ]; then echo "backend UP"; exit 0; fi
            sleep 5
          done
          echo "backend FAILED to start"; tail -200 backend.log; exit 1

      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server（等待 8000 就绪）
        working-directory: frontend
        run: |
          nohup yarn start > frontend.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 || true)
            if [ "$code" = "200" ]; then echo "frontend UP"; exit 0; fi
            sleep 5
          done
          echo "frontend FAILED to start"; tail -200 frontend.log; exit 1

      # UmiJS dev server compiles routes lazily on first request; the curl check
      # above only sees the HTML shell (200) before the JS bundle is ready, so the
      # very first test would race the cold compile. Warm /login in a real browser
      # (precompiles the shared vendor + route chunk) so the suite starts warm.
      - name: Warm up dev server（预编译 /login，避免首个用例撞冷编译）
        working-directory: frontend
        run: |
          node -e '
            const { chromium } = require("@playwright/test");
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              const deadline = Date.now() + 150000;
              let ok = false;
              while (Date.now() < deadline) {
                try {
                  await page.goto("http://localhost:8000/login", { waitUntil: "domcontentloaded", timeout: 30000 });
                  await page.getByTestId("auth-brand-shell").waitFor({ state: "visible", timeout: 15000 });
                  ok = true; break;
                } catch (e) { await page.waitForTimeout(3000); }
              }
              await browser.close();
              if (!ok) { console.error("warmup failed: /login did not render"); process.exit(1); }
              console.log("warmup ok: /login rendered");
            })();
          '

      - name: Run core-journey smoke（tests/e2e/smoke.spec.ts）
        working-directory: frontend
        run: npx playwright test tests/e2e/smoke.spec.ts --project=chromium

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: frontend/test-results/
          retention-days: 7
